<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grayson Fabian Cantu | Technical Communicator</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --glass-shine: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px; /* Enables 3D space */
        }

        /* --- LIQUID GLASS BACKGROUND --- */
        .liquid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #0a0a0a 70%);
            overflow: hidden;
        }

        /* Interactive liquid blob that follows or drifts */
        .liquid-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 20%;
            left: 25%;
            filter: blur(40px);
            animation: float 12s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, -50px) scale(0.9); }
        }

        /* --- 3D INTERACTIVE CARD CONTAINER --- */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 450px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* --- THE LIQUID GLASS CARD --- */
        .portfolio-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            text-align: center;
            
            /* Liquid Glass Effect */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.8),
                inset 0 1px 1px var(--glass-shine),
                inset 0 10px 20px rgba(255, 255, 255, 0.05);
            
            transform: translateZ(50px); /* Pushes content forward in 3D space */
            transition: box-shadow 0.3s ease;
        }

        .container:hover .portfolio-card {
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.9),
                inset 0 1px 2px rgba(255,255,255,0.1),
                inset 0 10px 30px rgba(255, 255, 255, 0.08);
        }

        /* --- TYPOGRAPHY --- */
        .meta-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* --- INTERACTIVE BUTTONS --- */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translateZ(20px); /* Layers items hierarchically in 3D */
        }

        .btn span {
            font-weight: 400;
        }

        .btn .arrow {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
            color: var(--text-secondary);
        }

        /* Hover states for the liquid glass buttons */
        .btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        .btn:hover .arrow {
            transform: translateX(4px);
            color: var(--text-primary);
        }

        /* --- CONTACT FOOTER --- */
        .footer-contact {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.8rem;
        }

        .footer-contact a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-contact a:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="liquid-bg">
        <div class="liquid-blob"></div>
    </div>

    <div class="container" id="interactive-card">
        <div class="portfolio-card">
            
            <span class="meta-tag">Portfolio</span>
            <h1>Grayson Fabian Cantu</h1>
            <p class="subtitle">Technical Communicator</p>

            <div class="links-container">
                <a href="https://github.com/Graysoncantu/Home/blob/main/Resume.pdf" target="_blank" class="btn">
                    <span>Curriculum Vitae / Resume</span>
                    <span class="arrow">→</span>
                </a>
                
                <a href="https://github.com/Graysoncantu" target="_blank" class="btn">
                    <span>GitHub Repositories</span>
                    <span class="arrow">→</span>
                </a>
            </div>

            <div class="footer-contact">
                <a href="mailto:graysonfabiancantu@iCloud.com">Email</a>
                <a href="tel:7377701981">737.770.1981</a>
            </div>

        </div>
    </div>

    <script>
        const card = document.getElementById('interactive-card');
        const motionArea = document.body;

        motionArea.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25; // Speed/Depth of tilt
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
        });

        // Smoothly snap back into place when mouse leaves
        motionArea.addEventListener('mouseleave', () => {
            card.style.transition = 'transform 0.5s ease';
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        motionArea.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });
    </script>
</body>
</html>
