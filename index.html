<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grayson Fabian Cantu | Technical Communicator</title>
    <style>
        /* --- DESIGN SYSTEM & TOKENS --- */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --glow-color: rgba(255, 255, 255, 0.15);
            --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* --- INTERACTIVE LIQUID BACKGROUND --- */
        #liquid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle 0px at 0px 0px, var(--glow-color) 0%, transparent 70%);
            transition: background 0.1s ease-out;
        }

        /* --- 3D PERSPECTIVE CONTAINER --- */
        .portfolio-wrapper {
            perspective: 1000px;
            z-index: 2;
            width: 100%;
            max-width: 650px;
        }

        /* --- LIQUID GLASS CARD --- */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
        }

        /* The glossy sheen overlay */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            background: var(--glass-shine);
            pointer-events: none;
            z-index: 3;
        }

        /* --- TYPOGRAPHY & LAYOUT --- */
        .header {
            transform: translateZ(50px); /* 3D Pop */
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #fff 0%, #86868b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        /* --- CAPABILITIES (ALL WRITERS) --- */
        .capabilities {
            transform: translateZ(30px);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .tag {
            font-size: 0.85rem;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .glass-card:hover .tag {
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* --- LINKS & INTERACTION --- */
        .links-container {
            transform: translateZ(40px);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .interactive-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
            text-decoration: none;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid transparent;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .interactive-link:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            padding-left: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .link-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        .interactive-link:hover .link-label {
            color: var(--text-primary);
        }

        .arrow {
            font-size: 1.1rem;
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .interactive-link:hover .arrow {
            transform: translateX(4px);
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .glass-card { padding: 2rem; }
            .capabilities { grid-template-columns: 1fr; gap: 0.6rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="liquid-canvas"></div>

    <div class="portfolio-wrapper">
        
        <main class="glass-card" id="tilt-card">
            
            <header class="header">
                <h1>Grayson Fabian Cantu</h1>
                <p class="subtitle">Technical Communicator & Information Architect</p>
            </header>

            <section class="capabilities">
                <div class="tag">Technical Documentation</div>
                <div class="tag">UX & Product Writing</div>
                <div class="tag">API & Dev Rel Content</div>
                <div class="tag">Copy & Creative Strategy</div>
            </section>

            <nav class="links-container">
                <a href="https://github.com/Graysoncantu/Home/blob/main/Resume.pdf" target="_blank" class="interactive-link">
                    <span class="link-label">Resume</span>
                    <span class="arrow">→</span>
                </a>
                <a href="https://github.com/Graysoncantu" target="_blank" class="interactive-link">
                    <span class="link-label">GitHub</span>
                    <span class="arrow">→</span>
                </a>
                <a href="mailto:graysonfabiancantu@iCloud.com" class="interactive-link">
                    <span class="link-label">Email</span>
                    <span class="arrow">→</span>
                </a>
                <a href="tel:7377701981" class="interactive-link">
                    <span class="link-label">Phone</span>
                    <span class="arrow">→</span>
                </a>
            </nav>

        </main>
    </div>

    <script>
        const card = document.getElementById('tilt-card');
        const canvas = document.getElementById('liquid-canvas');

        // 1. LIQUID GLASS MOUSE TRACKING
        // Creates a seamless flowing soft glow behind the blurred glass matrix
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            canvas.style.background = `radial-gradient(circle 250px at ${x}px ${y}px, var(--glow-color) 0%, transparent 100%)`;
        });

        // 2. 3D CARD TILT INTERACTION
        // Calculates subtle angle offsets relative to center point of the card
        document.addEventListener('mousemove', (e) => {
            if (!card) return;

            const rect = card.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;

            // Normalize values between -1 and 1
            const angleX = (e.clientY - cardCenterY) / (window.innerHeight / 2);
            const angleY = (e.clientX - cardCenterX) / (window.innerWidth / 2);

            // Cap the rotation to keep it sleek and minimalist (max 12 degrees)
            const rotateX = angleX * -12;
            const rotateY = angleY * 12;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Reset the 3D position flawlessly when the mouse leaves the viewport
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            canvas.style.background = `radial-gradient(circle 0px at 0px 0px, var(--glow-color) 0%, transparent 70%)`;
        });
    </script>
</body>
</html>
