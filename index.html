        const { useState, useEffect, useRef } = React;

        // Pure Vanilla Three.js Minimal Liquid Glass Orb Component
        function VanillaLiquidBackground() {
            const containerRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current) return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.z = 4;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(containerRef.current.clientWidth, containerRef.current.clientHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                containerRef.current.appendChild(renderer.domElement);

                // Create Distorted Sphere Geometry
                const geometry = new THREE.SphereGeometry(1, 64, 64);
                
                // Physical Liquid Glass Look Shader Material
                const material = new THREE.MeshPhysicalMaterial({
                    color: 0x111111,
                    roughness: 0.1,
                    metalness: 0.9,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.1,
                    reflectivity: 1.0
                });

                const sphere = new THREE.Mesh(geometry, material);
                scene.add(sphere);

                // Lighting Matrix
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
                scene.add(ambientLight);

                const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
                dirLight1.position.set(10, 10, 5);
                scene.add(dirLight1);

                const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
                dirLight2.position.set(-10, -10, -5);
                scene.add(dirLight2);

                // Animation Cycle loop for liquid deformation physics emulation
                let clock = new THREE.Clock();

                const animate = () => {
                    requestAnimationFrame(animate);
                    const elapsedTime = clock.getElapsedTime();

                    // Vertex displacement simulations via continuous rotation & slight scaling loops
                    sphere.rotation.y = elapsedTime * 0.15;
                    sphere.rotation.x = elapsedTime * 0.1;
                    
                    const k = 1.2;
                    const position = geometry.attributes.position;
                    for (let i = 0; i < position.count; i++) {
                        const p = new THREE.Vector3().fromBufferAttribute(position, i);
                        p.normalize().multiplyScalar(1 + 0.05 * Math.sin(p.y * k + elapsedTime * 2) * Math.cos(p.x * k + elapsedTime * 2));
                        position.setXYZ(i, p.x, p.y, p.z);
                    }
                    geometry.computeVertexNormals();
                    geometry.attributes.position.needsUpdate = true;

                    renderer.render(scene, camera);
                };

                animate();

                // Handle resize dynamically
                const handleResize = () => {
                    if (!containerRef.current) return;
                    camera.aspect = containerRef.current.clientWidth / containerRef.current.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(containerRef.current.clientWidth, containerRef.current.clientHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    if (containerRef.current) containerRef.current.innerHTML = '';
                };
            }, []);

            return <div ref={containerRef} class="w-full h-full" />;
        }

            );
        }
